<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Chinese flash cards</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--mut:#6b6b6b;--line:#e2e2e2;--ac:#2f4a6d;--acfg:#fff;--soft:#f4f4f4;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#121212;--fg:#ececec;--mut:#9a9a9a;--line:#2e2e2e;--ac:#9dbbe3;--acfg:#101010;--soft:#1c1c1c}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
main{max-width:480px;margin:0 auto;min-height:100%;padding:20px 18px 28px;display:flex;flex-direction:column}
[hidden]{display:none!important}
h1{font-size:22px;font-weight:600;margin:4px 0 18px}
.grp{margin:0 0 18px}
.grp>span{display:block;font-size:14px;color:var(--mut);margin-bottom:6px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;min-height:44px;padding:0 6px;border:0;border-left:1px solid var(--line);background:none;color:var(--fg);font:inherit;font-size:15px}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--ac);color:var(--acfg)}
select{width:100%;min-height:44px;margin-top:8px;padding:0 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);font:inherit;font-size:15px}
.btn{min-height:52px;border-radius:12px;border:1px solid var(--ac);background:var(--ac);color:var(--acfg);font:inherit;font-size:17px;font-weight:600;width:100%;cursor:pointer}
.btn.alt{background:none;color:var(--fg);border-color:var(--line);font-weight:500}
.btn:disabled{opacity:.4}
.link{background:none;border:0;color:var(--mut);font:inherit;font-size:14px;min-height:44px;padding:0 8px;cursor:pointer}
.bar{height:6px;background:var(--soft);border-radius:3px;overflow:hidden;margin:6px 0 6px}
.bar i{display:block;height:100%;background:var(--ac)}
.small{font-size:14px;color:var(--mut)}
#msg{min-height:20px;margin:8px 0;color:var(--mut);font-size:14px;text-align:center}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.card{flex:1;min-height:300px;max-height:60vh;border:1px solid var(--line);border-radius:16px;padding:22px 20px;display:flex;flex-direction:column;justify-content:space-between;position:relative;cursor:pointer;user-select:none;-webkit-user-select:none}
.card .lab{font-size:14px;color:var(--mut);padding-right:48px}
.card .main{text-align:center;font-size:30px;line-height:1.3;white-space:pre-line;overflow-wrap:anywhere;overflow-y:auto}
.card .main.long{font-size:22px}
.card .note{display:block;margin-top:12px;font-size:14px;line-height:1.4;color:var(--mut)}
.card .foot{font-size:13px;color:var(--mut);display:flex;justify-content:space-between}
.spk{position:absolute;top:8px;right:8px;width:44px;height:44px;border:0;background:none;color:var(--fg);font-size:22px;border-radius:50%;cursor:pointer}
.row{display:flex;gap:10px;margin-top:14px}
.row .btn{flex:1}
.nav{display:flex;justify-content:space-between;margin-top:6px}
.done{text-align:center;margin:auto 0}
.done h1{margin-bottom:8px}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
</style>
</head>
<body>
<main>
<section id="setup">
<h1>Chinese flash cards</h1>
<div class="grp"><span>Cards from</span>
<div class="seg" data-k="mode"><button data-v="random">Random</button><button data-v="theme">By theme</button></div>
<select id="theme" aria-label="Theme"></select></div>
<div class="grp"><span>Include</span>
<div class="seg" data-k="type"><button data-v="w">Words/Phrases</button><button data-v="s">Sentences</button><button data-v="both">Both</button></div></div>
<div class="grp"><span>Direction</span>
<div class="seg" data-k="dir"><button data-v="ep">English → Pinyin</button><button data-v="pe">Pinyin → English</button></div></div>
<div class="grp"><span>Show</span>
<div class="seg" data-k="show"><button data-v="all">All</button><button data-v="todo">Not got yet</button><button data-v="learn">Still learning</button></div></div>
<div class="grp"><span>Order</span>
<div class="seg" data-k="shuffle"><button data-v="1">Shuffled</button><button data-v="0">In sheet order</button></div></div>
<div id="msg"></div>
<button class="btn" id="go">Start</button>
<div class="grp" style="margin-top:22px"><span>Your progress</span>
<div class="bar"><i id="pbar"></i></div><div class="small" id="ptxt"></div>
<button class="link" id="reset" style="padding-left:0">Reset progress</button></div>
</section>

<section id="study" hidden>
<div class="top"><button class="link" id="back" style="padding-left:0">← Menu</button><span class="small" id="count"></span></div>
<div class="card" id="card" role="button" tabindex="0" aria-label="Flip card"></div>
<div id="msg2" class="small" style="text-align:center;min-height:20px;margin-top:8px"></div>
<div class="row"><button class="btn alt" id="learn">Still learning</button><button class="btn" id="got">Got it</button></div>
<div class="nav"><button class="link" id="prev">← Previous</button><button class="link" id="skip">Skip →</button></div>
</section>

<section id="end" hidden class="done">
<h1>Round finished</h1>
<p class="small" id="sum"></p>
<div style="display:grid;gap:10px;margin-top:18px"><button class="btn" id="again">Study again</button><button class="btn alt" id="menu">Back to menu</button></div>
</section>
</main>

gs?","p":"Nǐ xǐhuān māo háishi gǒu?","h":"你喜欢猫还是狗","s":1,"i":"0aa91111"},{"t":"Conjuctions","e":"Do you drink coffee or tea?","p":"Nǐ hē kāfēi háishi hē chá?","h":"你喝咖啡还是茶","s":1,"i":"7297d28b"},{"t":"Conjuctions","e":"Should I walk to the left or to the right?","p":"Wǎng zuǒbiān zǒu háishi wǎng yòubiān zǒu?","h":"往左边走还是往右边走","s":1,"i":"e2511845"},{"t":"Conjuctions","e":"He didn’t go to school today because he got sick.","p":"Tā jīntiān méi qù xuéxiào yīnwèi shēngbìng le.","h":"他今天没去学校因为生病了。","s":1,"i":"c5094a6d"},{"t":"Conjuctions","e":"He got sick, so he didn’t go to school today.","p":"Tā shēngbìng le suǒyǐ jīntiān méi qù xuéxiào.","h":"他生病了所以今天没去学校。","s":1,"i":"28fe6ce5"},{"t":"Conjuctions","e":"Because my husband is busy with work, we rarely go traveling.","p":"Yīnwèi zhàngfu gōngzuò máng suǒyǐ wǒmen hěn shǎo qù lǚyóu.","h":"因为丈夫工作忙所以我们很少去旅游。","s":1,"i":"a84c9b0e"},{"t":"Conjuctions","e":"Because the weather is very cold, he wore a lot of clothes.","p":"Yīnwèi tiānqì hěn lěng suǒyǐ tā chuān le hěn duō yīfu.","h":"因为天气很冷所以他穿了很多衣服。","s":1,"i":"77719b03"},{"t":"Conjuctions","e":"Because the plane ticket is a bit expensive, we’re taking the train to Beijing.","p":"Yīnwèi fēijī piào yǒudiǎn guì suǒyǐ wǒmen zuò huǒchē qù Běijīng.","h":"因为飞机票有点贵所以我们坐火车去北京。","s":1,"i":"b7f32654"},{"t":"Conjuctions","e":"Because it’s my first time coming to this place, I don’t know the way.","p":"Yīnwèi dì yī cì lái zhè ge dìfang suǒyǐ wǒ bù rènshi lù.","h":"因为第一次来这个地方所以我不认识路。","s":1,"i":"f77f9eba"},{"t":"Conjuctions","e":"If you are very busy, we won’t hold today’s meeting.","p":"Rúguǒ nǐ hěn máng, jīntiān de huìyì jiù bù kāi le.","h":"如果你很忙，今天的会议就不开了。","s":1,"i":"74ef7828"},{"t":"Conjuctions","e":"If you feel unwell, I’ll take you to the hospital right away.","p":"Rúguǒ nǐ juéde bù shūfu, wǒ jiù mǎshàng sòng nǐ qù yīyuàn.","h":"如果你觉得不舒服，我就马上送你去医院。","s":1,"i":"d4f999aa"},{"t":"Conjuctions","e":"If you don’t like it here, we’ll leave.","p":"Nǐ rúguǒ bù xǐhuān zhèlǐ, wǒmen jiù zǒu.","h":"你如果不喜欢这里，我们就走。","s":1,"i":"00e756ff"},{"t":"Conjuctions","e":"If this meeting is very important, you should prepare early.","p":"Rúguǒ zhè ge huìyì hěn zhòngyào, nǐ jiù zǎo diǎn zhǔnbèi hǎo.","h":"如果这个会议很重要，你就早点准备好。","s":1,"i":"7a9924b1"},{"t":"Prepositions","e":"To; towards; regarding (preposition)","p":"Duì","h":"对","s":0,"i":"47099c8b"},{"t":"Prepositions","e":"What do you want to say to him/her?","p":"Nǐ yào duì tā shuō shénme ma?","h":"你要对他说什么吗？","s":1,"i":"0cef029c"},{"t":"Prepositions","e":"The boyfriend is very good to her.","p":"Nán péngyou duì tā fēicháng hǎo.","h":"男朋友对她非常好。","s":1,"i":"3458663e"},{"t":"Prepositions","e":"He smiled at me.","p":"Tā duì wǒ xiào le yīxià.","h":"他对我笑了一下。","s":1,"i":"a682e5c2"},{"t":"Prepositions","e":"Running more is good for the body/health.","p":"Duō pǎobù duì shēntǐ hǎo.","h":"多跑步对身体好。","s":1,"i":"c12602f8"},{"t":"Prepositions","e":"Give, to, for","p":"Gěi","h":"给","s":0,"i":"7b2d7192"},{"t":"Prepositions","e":"He bought me a book.","p":"Tā gěi wǒ mǎi le yī běn shū","h":"他给我买了一本书","s":1,"i":"99ef7db1"},{"t":"Prepositions","e":"Mom made fish for me.","p":"Māma gěi wǒ zuò le yú","h":"妈妈给我做了鱼","s":1,"i":"15dfaddd"},{"t":"Prepositions","e":"Towards (in the direction of)","p":"Wǎng","h":"往","s":0,"i":"55cbb800"},{"t":"Prepositions","e":"From/Since (starting point in time/place)","p":"Cóng","h":"从","s":0,"i":"3adcf310"},{"t":"Prepositions","e":"To; until; arrive at (ending point)","p":"Dào","h":"到","s":0,"i":"4818e8f3"},{"t":"Prepositions","e":"From here, go forward (straight ahead) to Renmin Road, then turn right.","p":"Cóng zhè wǎng qián, dào Rénmín Lù wǎng yòu zǒu.","h":"从这往前到人民路往右走","s":1,"i":"ce23ae1f"},{"t":"Prepositions","e":"From here to my home is very far.","p":"Cóng zhèlǐ dào wǒ jiā hěn yuǎn","h":"从这里到我家很远","s":1,"i":"50fa9110"},{"t":"Prepositions","e":"From here, walk left for ten minutes and you’ll arrive.","p":"Nǐ cóng zhè wǎng zuǒ zǒu shí fēnzhōng jiù dào le","h":"你从这往左走十分钟就到了","s":1,"i":"fd325de8"},{"t":"Prepositions","e":"How do you get to the airport from here?","p":"Cóng zhè zěnme qù jīchǎng?","h":"从这怎么去机场","s":1,"i":"8dd66fe8"},{"t":"Prepositions","e":"He came from school.","p":"Tā cóng xuéxiào lái","h":"他从学校来","s":1,"i":"34e1877e"},{"t":"Prepositions","e":"How much does it cost to take a taxi from the airport to your home?","p":"Cóng jīchǎng dào nǐ jiā zuò chūzūchē yào duōshǎo qián?","h":"从机场到你家坐出租车要多少钱","s":1,"i":"375e7c5f"},{"t":"Prepositions","e":"How long does it take to get from the airport to the hotel?","p":"Cóng jīchǎng dào jiǔdiàn yào duō cháng shíjiān?","h":"从机场到酒店要多长时间","s":1,"i":"42cf9edf"},{"t":"Prepositions","e":"How long does it take from home to school?","p":"Cóng jiā dào xuéxiào yào duō cháng shíjiān?","h":"从家到学校要多长时间。","s":1,"i":"a2672f16"},{"t":"Prepositions","e":"From my home to your home is very near.","p":"Cóng wǒ jiā dào nǐ jiā fēicháng jìn","h":"从我家到你家非常近","s":1,"i":"c7f1ca00"},{"t":"Prepositions","e":"It takes fifteen minutes to walk from my home to the subway station.","p":"Cóng wǒ jiā dào dìtiězhàn zǒu lù yào shíwǔ fēnzhōng.","h":"从我家到地铁站走路要十五分钟","s":1,"i":"e8382805"},{"t":"Prepositions","e":"Where did you come from?","p":"Nǐ shì cóng nǎ lái de","h":"你是从哪来的","s":1,"i":"514d055c"},{"t":"Prepositions","e":"We start work from nine o'clock.","p":"Wǒmen cóng jiǔ diǎn kāishǐ shàngbān.","h":"我们从九点开始上班。","s":1,"i":"95be3970"},{"t":"Prepositions","e":"From now on, I want to drink more water and exercise more.","p":"Cóng xiànzài kāishǐ wǒ yào duō hē shuǐ duō yùndòng.","h":"从现在开始我要多喝水多运动。","s":1,"i":"0a6f330d"},{"t":"Prepositions","e":"From last week, I’ve been catching a cold.","p":"Cóng shàng de xīngqī kāishǐ wǒ jiù gǎnmào le.","h":"从上个星期开始我就感冒了。","s":1,"i":"8f8f949b"},{"t":"Prepositions","e":"From tomorrow, I’ll take the subway to the company.","p":"Cóng míngtiān kāishǐ wǒ zuò dìtiě qù gōngsī.","h":"从明天开始我坐地铁去公司。","s":1,"i":"1710d1b5"},{"t":"Prepositions","e":"From Monday to Friday, it will rain.","p":"Cóng xīngqīyī dào xīngqīwǔ dōu yào xiàyǔ.","h": es","e":"Exclamation particle","p":"a","h":"啊","s":0,"i":"52736cce"},{"t":"Particles","e":"You all sing very well!","p":"Nǐmen chàng de hěn hǎo a!","h":"你们唱得很好啊！","s":1,"i":"666dd340"},{"t":"Particles","e":"I don’t know!","p":"Wǒ bù zhīdào a!","h":"我不知道啊！","s":1,"i":"782dca09"},{"t":"Particles","e":"My cat","p":"Wǒ de māo","h":"我的猫","s":0,"i":"c61c2617"},{"t":"Particles","e":"The book on the table","p":"Zhuōzi shàng de shū","h":"桌子上的书","s":1,"i":"caea6080"},{"t":"Particles","e":"There are very few Americans at our school.","p":"Wǒmen xuéxiào de Měiguó rén hěn shǎo.","h":"我们学校的美国人很少","s":1,"i":"a0d69f23"},{"t":"Grammatical Structures","e":"Is... (emphasizes details of past action)","p":"Shì...de","h":"是...的","s":1,"i":"6624d665"},{"t":"Grammatical Structures","e":"How did he/she come?","p":"Tā shì zěnme lái de?","h":"他/她是怎么来的？","s":1,"i":"70ca572a"},{"t":"Grammatical Structures","e":"He/she came by plane.","p":"Tā shì zuò fēijī lái de.","h":"他/她是坐飞机来的。","s":1,"i":"c536d8d9"},{"t":"Grammatical Structures","e":"When did you buy your air conditioner?","p":"Nǐ de kōngtiáo shì shénme shíhòu mǎi de?","h":"你的空调是什么时候买的？","s":1,"i":"b5477571"},{"t":"Grammatical Structures","e":"Did you eat at school?","p":"Nǐ shì zài xuéxiào chī de ma?","h":"你是在学校吃的吗？","s":1,"i":"21bfbb1f"},{"t":"Grammatical Structures","e":"Today's meal was made by Dad.","p":"Jīntiān de fàn shì bàba zuò de.","h":"今天的饭是爸爸做的。","s":1,"i":"52520685"},{"t":"Grammatical Structures","e":"Who did you learn your Chinese from?","p":"Nǐ de Hànyǔ shì hé shéi xué de?","h":"你的汉语是和谁学的？","s":1,"i":"e2a5d900"},{"t":"Grammatical Structures","e":"When did you watch this movie?","p":"Zhè gè diànyǐng nǐ shì shénme shíhòu kàn de?","h":"这个电影你是什么时候看的？","s":1,"i":"32cb5eee"},{"t":"Grammatical Structures","e":"I watched this movie yesterday.","p":"Zhè gè diànyǐng wǒ shì zuótiān kàn de.","h":"这个电影我是昨天看的。","s":1,"i":"b7b7501e"},{"t":"Grammatical Structures","e":"The computer was bought at the store in front.","p":"Diànnǎo shì zài qiánmiàn nà gè shāngdiàn mǎi de.","h":"电脑是在前面那个商店买的。","s":1,"i":"be50824f"},{"t":"Grammatical Structures","e":"Who did you hear it from?","p":"Nǐ shì tīng shéi shuō de?","h":"你是听谁说的？","s":1,"i":"5e15b8f5"},{"t":"Grammatical Structures","e":"The fruit was bought by Dad.","p":"Shuǐguǒ shì bàba mǎi de.","h":"水果是爸爸买的。","s":1,"i":"449afc87"},{"t":"Grammatical Structures","e":"Yesterday, I called my mum and dad.","p":"Zuótiān wǒ hé wǒ de bàba māma dǎ diànhuà de.","h":"昨天我和我的爸爸妈妈打电话的。","s":1,"i":"eb327b8a"},{"t":"Grammatical Structures","e":"About to/Going to","p":"Yào...le","h":"要...了","s":1,"i":"26031c93","n":"(indicates an action is about to happen)"},{"t":"Grammatical Structures","e":"It’s going to rain.","p":"Yào xiàyǔ le.","h":"要下雨了","s":0,"i":"25f8b26e"},{"t":"Grammatical Structures","e":"My girlfriend's birthday is coming up.","p":"Wǒ nǚ péngyou yào guò shēngrì le.","h":"我女朋友要过生日了。","s":1,"i":"982a6e4d"},{"t":"Grammatical Structures","e":"verb+bù+verb questions","p":"bù","h":"不","s":0,"i":"309f62a5"},{"t":"Grammatical Structures","e":"Can you swim?","p":"Nǐ huì bù huì yóuyǒng?","h":"你会不会游泳？","s":1,"i":"e63506c1"},{"t":"Grammatical Structures","e":"Is it hot today?","p":"Jīntiān rè bù rè?","h":"今天热不热？","s":1,"i":"d1d56b91"},{"t":"Grammatical Structures","e":"Is your home far from the company?","p":"Nǐ jiā lǐ gōngsī yuǎn bù yuǎn?","h":"你家离公司远不远？","s":1,"i":"717d1757"},{"t":"Grammatical Structures","e":"verb+de+adjective (marker of complement)","p":"de","h":"得","s":0,"i":"529ad121"},{"t":"Grammatical Structures","e":"Older sister swims the fastest.","p":"Jiějie yóu de zuì kuài.","h":"姐姐游得最快。","s":1,"i":"6e12350d"},{"t":"Grammatical Structures","e":"Shasha sings extremely well.","p":"Shāshā chàng de fēicháng hǎo.","h":"莎莎唱得非常好。","s":1,"i":"e1f542ea"},{"t":"Grammatical Structures","e":"He did it wrong.","p":"Tā zuò de bù duì.","h":"他做得不对。","s":1,"i":"7343804b"},{"t":"Grammatical Structures","e":"You walk too fast.","p":"Nǐ zǒu de tài kuài le.","h":"你走得太快了。","s":1,"i":"18b03654"},{"t":"Grammatical Structures","e":"He runs not fast.","p":"Tā pǎo de bù kuài.","h":"他跑得不快。","s":1,"i":"dd38f21f"},{"t":"Grammatical Structures","e":"This restaurant's dishes are not done well.","p":"Zhège fàndiàn cài zuò de bù hǎo.","h":"这个饭店菜做得不好。","s":1,"i":"45caacfa"},{"t":"Grammatical Structures","e":"For separable verbs in manner complements with de + adjective, repeat the core verb after the full separable verb: Full separable verb + Core verb + de + Adjective. Simplified: Use core verb alone.)","p":"de","h":"得","s":0,"i":"c8c6dae4"},{"t":"Grammatical Structures","e":"I can find my watch.","p":"Wǒ zhǎo de dào shǒubiǎo.","h":"我找得到手表。","s":1,"i":"d4ca0546"},{"t":"Grammatical Structures","e":"I can't find my watch.","p":"Wǒ zhǎo bù dào shǒubiǎo.","h":"我找不到手表。","s":1,"i":"3b13eef5"},{"t":"Grammatical Structures","e":"I can see the TV.","p":"Wǒ kàn de jiàn diànshì.","h":"我看得见电视。","s":1,"i":"363f4053"},{"t":"Grammatical Structures","e":"I can't see the TV.","p":"Wǒ kàn bù jiàn diànshì.","h":"我看不见电视。","s":1,"i":"56d02319"},{"t":"Grammatical Structures","e":"I can finish this meal.","p":"Wǒ chī de wán zhè dùn fàn.","h":"我吃得完这顿饭。","s":1,"i":"5ad8553e"},{"t":"Grammatical Structures","e":"I can't finish this meal.","p":"Wǒ chī bù wán zhè dùn fàn.","h":"我吃不完这顿饭。","s":1,"i":"99b51167"},{"t":"Grammatical Structures","e":"Older sister dances extremely well. (Repeated form)","p":"Jiějie tiàowǔ tiào de fēicháng hǎo.","h":"姐姐跳舞跳得非常好。","s":1,"i":"68dda888"},{"t":"Grammatical Structures","e":"Older sister dances extremely well. (Simplified form, using core verb only)","p":"Jiějie tiào de fēicháng hǎo.","h":"姐姐跳得非常好。","s":1,"i":"ba80cd17"},{"t":"Grammatical Structures","e":"He swims very fast. (Repeated form)","p":"Tā yóuyǒng yóu de hěn kuài.","h":"他游泳游得很快。","s":1,"i":"012a51ea"},{"t":"Grammatical Structures","e":"He swims very fast. (Simplified form)","p":"Tā yóu de hěn kuài.","h":"他游得很快。","s":1,"i":"e553727b"},{"t":"Grammatical Structures","e":"I eat very quickly. (Repeated form)","p":"Wǒ chīfàn chī de hěn kuài.","h":"我吃饭吃得很快。","s":1,"i":"41b292c3"},{"t":"Grammatical Structures","e":"I eat very quickly. (Simplified form)","p":"Wǒ chī de hěn kuài.","h":"我吃得很快。","s":1,"i":"8929cec2"},{"t":"Grammatical Structures","e":"Older sister dances not well. (Repeated form, negative)","p":"Jiějie tiàowǔ tiào de bù hǎo.","h":"姐姐跳舞跳得不好。","s":1,"i":"b0a48a7d"},{"t":"Grammatical Structures","e":"Older sister dances not well. (Simplified form, negative)","p":"Jiějie tiào de bù hǎo.","h":"姐姐跳得不不好。","s":1,"i":"a99878c7"},{"t":"Grammatical Structures","e":"He doesn't swim fast. / He swims slowly. (Repeated form, negative)","p":"Tā yóuyǒng yóu de bù kuài.","h":"他游泳游得不快。","s":1,"i":"62023562"},{"t":"Grammatical Structures","e":"He doesn't swim fast. / He swims slowly. (Simplified form, negative)","p":"Tā yóu de bù kuài.","h":"他游得不快。","s":1,"i":"4c53a6d1"},{"t":"Grammatical Structures","e":"I don't eat quickly. / I eat slowly. (Repeated form, negative)","p":"Wǒ chīfàn chī de bù kuài.","h":"我吃饭吃得不快。","s":1,"i":"92b9ab64"},{"t":"Grammatical Structures","e":"I don't eat quickly. / I eat slowly. (Simplified form, negative)","p":"Wǒ chī de bù kuài.","h":"我吃得不快。","s":1,"i":"eaa86291"},{"t":"Grammatical Structures","e":"Already (with dōu … le)","p":"Dōu … le","h":"都…了","s":0,"i":"5824e50e","n":"emphasizes that something is \"already\" to a surprising or noteworthy degree (often implying \"it's so late/already this much!\") (see Yǐjīng)"},{"t":"Grammatical Structures","e":"Xiaoming is already two years old.","p":"Xiǎomíng dōu shì èr suì le.","h":"小明都两岁了。","s":1,"i":"f2af22e9"},{"t":"Grammatical Structures","e":"It’s already 9 a.m., and you’re still not up.","p":"Dōu zǎoshang jiǔ diǎn le, nǐ hái bù qǐchuáng.","h":"都早上九点了你还不起来。","s":1,"i":"17361001"},{"t":"Grammatical Structures","e":"I’ve already arrived, where are you?","p":"Wǒ dōu dào le, nǐ zài nǎ?","h":"我都到了你在哪？","s":1,"i":"7cb33361"},{"t":"Grammatical Structures","e":"I’ve already booked the room.","p":"Wǒ dōu yùdìng wán fángjiān le.","h":"我都预定完房间了。","s":1,"i":"85138a3a"},{"t":"Grammatical Structures","e":"Stop / Don’t … anymore","p":"Búyào … le","h":"不要…了","s":0,"i":"ecfaaca6","n":"(Slightly more polite than Bié … le, often used when giving advice or in writing)"},{"t":"Grammatical Structures","e":"Stop talking.","p":"Nǐ búyào shuō le.","h":"你不要说了。","s":1,"i":"0149fdef"},{"t":"Grammatical Structures","e":"Don’t buy more clothes.","p":"Búyào zài mǎi yīfu le.","h":"不要再买衣服了。","s":1,"i":"5383cac7"},{"t":"Grammatical Structures","e":"Don’t wait for me.","p":"Búyào děng wǒ le.","h":"不要等我了。","s":1,"i":"fe66fe9b"},{"t":"Grammatical Structures","e":"No need to prepare dinner today.","p":"Jīntiān búyào zhǔnbèi wǎnfàn le.","h":"今天不要准备晚饭了。","s":1,"i":"ac9cfd9e"},{"t":"Grammatical Structures","e":"Stop taking medicine.","p":"Búyào chī yào le.","h":"不要吃药了。","s":1,"i":"29094768"},{"t":"Grammatical Structures","e":"Stop watching TV.","p":"Nǐ búyào kàn diànshì le.","h":"你不要看电视了。","s":1,"i":"0ad386a5"},{"t":"Grammatical Structures","e":"Dad told Xiaoming to stop watching TV.","p":"Bàba ràng Xiǎomíng búyào kàn diànshì le.","h":"爸爸让小明不要看电视了。","s":1,"i":"0c629d00"},{"t":"Grammatical Structures","e":"Stop … / Don’t … anymore","p":"Bié … le","h":"别…了","s":0,"i":"86840ab6","n":"(Everyday spoken command, sounds natural and a bit urgent/soft)"},{"t":"Grammatical Structures","e":"Don't cook today.","p":"Jīntiān bié zuò fàn le.","h":"今天别做饭了。","s":1,"i":"3787e842"},{"t":"Grammatical Structures","e":"Don't go too fast.","p":"Bié tài kuài le.","h":"别太快了。","s":1,"i":"17594b0e"},{"t":"Grammatical Structures","e":"Stop watching TV.","p":"Bié kàn diànshì le.","h":"别看电视了。","s":1,"i":"8443bb4a"},{"t":"Grammatical Structures","e":"Almost / nearly (with kuài … le)","p":"Kuài … le","h":"快…了","s":0,"i":"2a255e0c","n":"(Means that an action or event is about to occur.)"},{"t":"Grammatical Structures","e":"I’m almost there.","p":"Wǒ kuài dào le.","h":"我快到了。","s":1,"i":"1787a082"},{"t":"Grammatical Structures","e":"It’s almost twelve o’clock.","p":"Kuài shí’èr diǎn le.","h":"快十二点了。","s":1,"i":"60998291"},{"t":"Grammatical Structures","e":"His cold is almost better.","p":"Tā gǎnmào kuài hǎo le.","h":"他感冒快好了。","s":1,"i":"f5a749b3"},{"t":"Grammatical Structures","e":"Dinner is almost ready.","p":"Wǎnfàn kuài zuò hǎo le.","h":"晚饭快做好了。","s":1,"i":"2fd9ffa2"},{"t":"Grammatical Structures","e":"Have you already finished today’s homework?","p":"Jīntiān de zuòyè nǐ dōu zuò wán le ma?","h":"今天的作业你都做完了吗？","s":1,"i":"0cd9e51c"},{"t":"Grammatical Structures","e":"Almost done.","p":"Kuài zuò wán le.","h":"快做完了。","s":1,"i":"d595ef6b"},{"t":"Grammatical Structures","e":"Used after a verb referring to something that happened previously (already, never, ever)","p":"Guò","h":"过","s":0,"i":"bd8680a0"},{"t":"Grammatical Structures","e":"I’ve already eaten lunch.","p":"Wǒ chī guo wǔfàn le.","h":"我吃过午饭了。","s":1,"i":"c3cc5c7d"},{"t":"Grammatical Structures","e":"I’ve seen this movie before.","p":"Wǒ kàn guo zhè ge diànyǐng.","h":"我看过这个电影。","s":1,"i":"c4f831b4"},{"t":"Grammatical Structures","e":"I’ve never made this dish before.","p":"Wǒ méiyǒu zuò guo zhè ge cài.","h":"我没有做过这个菜。","s":1,"i":"7dd95da5"},{"t":"Grammatical Structures","e":"Have you ever been to Beijing?","p":"Nǐ qù guo Běijīng ma?","h":"你去过北京吗？","s":1,"i":"92a1a0e5"},{"t":"Grammatical Structures","e":"(directional verb) to return / come back / go back","p":"Huí + lái / qù","h":"回 + 来 / 去","s":1,"i":"ddb3c533"},{"t":"Grammatical Structures","e":"We came back by train.","p":"Wǒmen shì zuò huǒchē huílai de.","h":"我们是坐火车回来的。","s":1,"i":"a72994a9"},{"t":"Grammatical Structures","e":"I will go back at five o'clock.","p":"Wǒ wǔ diǎn huíqù.","h":"我五点回去。","s":1,"i":"328d7ece"},{"t":"Grammatical Structures","e":"When will you come back?","p":"Nǐ shénme shíhou huílai?","h":"你什么时候回来？","s":1,"i":"eca20728"},{"t":"Grammatical Structures","e":"I will go back in February to visit Mom and Dad.","p":"Wǒ shí'èr yuè huíqù kàn bàba māma.","h":"我十二月回去看爸爸妈妈。","s":1,"i":"aaa47d7e"},{"t":"Grammatical Structures","e":"Shasha is going back tomorrow.","p":"Shāsha míngtiān huí qù.","h":"莎莎明天回去。","s":1,"i":"fe867ca0"},{"t":"Grammatical Structures","e":"Buy some fruit when you come back.","p":"Nǐ huílai de shíhou mǎi diǎn shuǐguǒ.","h":"你回来的时候买点水果。","s":1,"i":"b2de8861"},{"t":"Grammatical Structures","e":"Don't go back.","p":"Nǐ bié huí qù.","h":"你别回去。","s":1,"i":"b066b554"},{"t":"Grammatical Structures","e":"Don't come back anymore.","p":"Nǐ bùyào huílai le.","h":"你不要回来了。","s":1,"i":"5c8c3860"},{"t":"Grammatical Structures","e":"For / to / in terms of / speaking of","p":"Duì... láishuō","h":"对...来说","s":1,"i":"33c5bac8","n":"\"for [someone], ...\" / \"in terms of [someone], ...\" / \"as far as [someone] is concerned, ...\""},{"t":"Grammatical Structures","e":"For me, getting off work at 8 every day is too tiring.","p":"Duì wǒ láishuō, měi tiān bā diǎn xiàbān tài lèi le.","h":"对我来说，每天八点下班太累了。","s":1,"i":"6ea094dd"},{"t":"Grammatical Structures","e":"These things are not problems for him.","p":"Zhèxiē duì tā láishuō dōu bù shì wèntí.","h":"这些对他来说都不是问题。","s":1,"i":"a1b5919e"},{"t":"Grammatical Structures","e":"For me, math is very difficult.","p":"Duì wǒ láishuō, shùxué hěn nán.","h":"对我来说，数学很难。","s":1,"i":"bafa45a4"},{"t":"Grammatical Structures","e":"For him, this piece of clothing is too big.","p":"Duì tā láishuō, zhè jiàn yīfu tài dà le.","h":"对他来说，这件衣服太大了。","s":1,"i":"f1444e34"},{"t":"Grammatical Structures","e":"First A","p":"Xiān A, Ránhòu B, Zuìhòu C","h":"先 A，然后 B","s":1,"i":"75841811","n":"Then B Finally C"},{"t":"Grammatical Structures","e":"First","p":"Xiān","h":"先","s":0,"i":"aad3233c"},{"t":"Grammatical Structures","e":"Then / after that","p":"Ránhòu","h":"然后","s":0,"i":"fb6af2c7"},{"t":"Grammatical Structures","e":"Finally / in the end / last)","p":"Zuìhòu","h":"最后","s":0,"i":"a726fb12"},{"t":"Grammatical Structures","e":"Try this color first.","p":"Nǐ xiān shì yīxià zhè ge yánsè.","h":"你先试一下这个颜色。","s":1,"i":"62d29dad"},{"t":"Grammatical Structures","e":"You do your homework first, then we go watch a movie.","p":"Nǐ xiān xiě zuòyè, ránhòu wǒmen qù kàn diànyǐng.","h":"你先写作业，然后我们去看电影。","s":1,"i":"d7d95103"},{"t":"Grammatical Structures","e":"Every time I go swimming first, then go home.","p":"Wǒ měi cì xiān, ránhòu qù yóuyǒng.","h":"我每次先，然后去游泳。","s":1,"i":"399c34cf"},{"t":"Grammatical Structures","e":"I will make a phone call first, then go eat with you.","p":"Wǒ xiān dǎ ge diànhuà, ránhòu hé nǐ qù chī fàn.","h":"我先打个电话，然后和你去吃饭。","s":1,"i":"df4b2e95"},{"t":"Grammatical Structures","e":"You finish your work first, then come help me.","p":"Nǐ xiān zuò wán nǐ de gōngzuò, ránhòu zài lái bāng wǒ.","h":"你先做完你的工作，然后再来帮我。","s":1,"i":"05a7e5c9"},{"t":"Grammatical Structures","e":"I will pick up my daughter first, then we will go home together.","p":"Wǒ xiān qù jiē nǚ'ér, ránhòu zài yīqǐ huí jiā.","h":"我先去接女儿，然后再一起回家。","s":1,"i":"3d62147e"},{"t":"Grammatical Structures","e":"She will go to the hospital first, then to school.","p":"Tā xiān qù yīyuàn, zài qù xuéxiào.","h":"她先去医院，再去学校。","s":1,"i":"d3a19f64"},{"t":"Grammatical Structures","e":"Today is the last day of August.","p":"Jīntiān shì bā yuè de zuìhòu yī tiān.","h":"今天是八月的最后一天。","s":1,"i":"cf2be393"},{"t":"Grammatical Structures","e":"In the end, he still didn't buy that pair of shoes.","p":"Zuìhòu tā háishì méi mǎi nà shuāng xié.","h":"最后他还是没买那双鞋。","s":1,"i":"cc83b24e"},{"t":"Grammatical Structures","e":"The last time Wang Ming went to Beijing was in 2018.","p":"Wáng Míng zuìhòu yī cì qù Běijīng shì èr líng yī bā nián.","h":"王明最后一次去北京是2018年。","s":1,"i":"1874fd88"},{"t":"Grammatical Structures","e":"First walk to the subway station, then take Line 3 to Shanghai Railway Station, and finally walk for five minutes to reach the company.","p":"Nǐ xiān zǒu lù dào dìtiězhàn, ránhòu zuò sān hào xiàn dào \"Shànghǎi Huǒchēzhàn\", zuìhòu zài zǒu wǔ fēnzhōng jiù dào gōngsī le.","h":"你先走路到地铁站，然后坐三号线到“上海火车站”，最后再走五分钟就到公司了。","s":1,"i":"919e33e4"},{"t":"Grammatical Structures","e":"First we eat, then go to the park, and finally go home.","p":"Wǒmen xiān chī fàn, ránhòu qù gōngyuán, zuìhòu huí jiā.","h":"我们先吃饭，然后去公园，最后回家。","s":1,"i":"c6ccaa4a"},{"t":"Grammatical Structures","e":"Expresses surprise, exaggeration or strong emphasis (e.g. so [adjective], how [adjective], really)","p":"duō (me) ... a !","h":"多(么)...啊","s":1,"i":"8e4c9e13"},{"t":"Grammatical Structures","e":"The weather is so nice today!","p":"Jīntiān tiānqì duō hǎo a!","h":"今天天气多好啊！","s":1,"i":"d2f1f7c8"},{"t":"Grammatical Structures","e":"How I'd love to go to China! / I really want to go to China!","p":"Wǒ duōme xiǎng qù Zhōngguó a!","h":"我多么想去中国啊！","s":1,"i":"45c68fcc"},{"t":"Grammatical Structures","e":"This photo is so good! / This photo turned out so well!","p":"Zhè zhāng zhàopiàn pāi de duō hǎo a!","h":"这张照片拍得多好啊！","s":1,"i":"796f9d72"},{"t":"Grammatical Structures","e":"This skirt is so beautiful!","p":"Zhè tiáo qúnzi duō piàoliang a!","h":"这条裙子多漂亮啊！","s":1,"i":"becfeaea"},{"t":"Grammatical Structures","e":"The world is so big! / How big the world is!","p":"Shìjiè duōme dà a!","h":"世界多么大啊！","s":1,"i":"4706fc08"},{"t":"Grammatical Structures","e":"He really wants to go traveling! / How much he wants to go traveling!","p":"Tā duōme xiǎng qù lǚyóu a!","h":"他多么想去旅游啊！","s":1,"i":"2a2c8481"},{"t":"Grammatical Structures","e":"\"no matter what/who/where\" or \"everything/everyone/everywhere\"","p":"shénme / shéi / nǎlǐ + dōu","h":"什么 / 谁 / 哪里 + 都","s":1,"i":"2a27096f"},{"t":"Grammatical Structures","e":"I want to buy everything.","p":"Wǒ shénme dōu xiǎng mǎi.","h":"我什么都想买。","s":1,"i":"f62a3b9f"},{"t":"Grammatical Structures","e":"No one is happy.","p":"Shéi dōu bù gāoxìng.","h":"谁都不高兴。","s":1,"i":"d18185cf"},{"t":"Grammatical Structures","e":"He doesn't want to go anywhere.","p":"Tā nǎlǐ yě bù xiǎng qù.","h":"他哪里也不想去。","s":1,"i":"b63563c4"},{"t":"Grammatical Structures","e":"He can come anytime.","p":"Tā shénme shíhou lái dōu kěyǐ.","h":"他什么时候来都可以。","s":1,"i":"a44789f1"},{"t":"Grammatical Structures","e":"Everyone likes her.","p":"Shéi dōu xǐhuān tā.","h":"谁都喜欢她。","s":1,"i":"0f8ed81e"},{"t":"Grammatical Structures","e":"You don't need to bring anything.","p":"Nǐ shénme dōu bù yòng dài.","h":"你什么都不用带。","s":1,"i":"a89877b7"},{"t":"Grammatical Structures","e":"He doesn't want to eat anything.","p":"Tā shénme dōu bù xiǎng chī.","h":"他什么都不想吃。","s":1,"i":"d14192e5"},{"t":"Grammatical Structures","e":"I don't want to see anyone.","p":"Wǒ shéi dōu bù xiǎng jiàn.","h":"我谁都不想见。","s":1,"i":"0f53ef00"},{"t":"Grammatical Structures","e":"While / at the same time","p":"Yībiān ... yībiān ...","h":"一边……一边……","s":1,"i":"7be6a4ee"},{"t":"Grammatical Structures","e":"He likes listening to music while running.","p":"Tā xǐhuān yībiān pǎobù yībiān tīng yīnyuè.","h":"他喜欢一边跑步一边听音乐。","s":1,"i":"8f4ffe63"},{"t":"Grammatical Structures","e":"They are drinking coffee while chatting.","p":"Tāmen yībiān hē kāfēi, yībiān liáotiān.","h":"他们一边喝咖啡，一边聊天。","s":1,"i":"dbb7718c"},{"t":"Grammatical Structures","e":"He thinks singing while dancing is very tiring.","p":"Tā juéde yībiān chànggē yībiān tiàowǔ hěn lèi.","h":"他觉得一边唱歌一边跳舞很累。","s":1,"i":"10091d88"},{"t":"Grammatical Structures","e":"We talk while walking.","p":"Wǒmen yībiān zǒu yībiān shuō.","h":"我们一边走一边说。","s":1,"i":"35b5f22b"},{"t":"Grammatical Structures","e":"Don’t talk on the phone while driving.","p":"Búyào yībiān dǎ diànhuà yībiān kāi chē.","h":"不要一边打电话一边开车。","s":1,"i":"4f185e09"},{"t":"Ongoing actions","e":"Indicates an action is ongoing or happening now (before verb)","p":"Zài","h":"在","s":0,"i":"1419123b","n":"Active processes happening now. Like English present continuous: \"am/is/are + verb-ing\"."},{"t":"Ongoing actions","e":"He is not watching TV.","p":"Tā méi zài kàn diànshì.","h":"他没在看电视","s":1,"i":"e95acaa1"},{"t":"Ongoing actions","e":"I’m not waiting for you, I’m waiting for Lili.","p":"Wǒ méi zài děng nǐ, wǒ zài děng Lìlì ne","h":"我没在等你，我在等丽丽呢","s":1,"i":"f8f90885"},{"t":"Ongoing actions","e":"Emphasizes an action is ongoing or happening right at this moment.","p":"Zhèngzài","h":"正在","s":0,"i":"b23b0797","n":"Same as Zài, but adds emphasis: \"exactly at this moment\"."},{"t":"Ongoing actions","e":"They are eating lunch.","p":"Tāmen zhèngzài chī wǔfàn","h":"他们正在吃午饭","s":1,"i":"d9706d53"},{"t":"Ongoing actions","e":"The boys are playing football.","p":"Nánhái men zhèngzài tī zúqiú.","h":"男孩们正在踢足球","s":1,"i":"8cf5c103"},{"t":"Ongoing actions","e":"The girls are dancing.","p":"Nǚhái men zhèngzài tiàowǔ ne.","h":"女孩们正在跳舞呢","s":1,"i":"f8db9f36"},{"t":"Ongoing actions","e":"Particle used after a verb to indicate that the action is ongoing.","p":"Zhe","h":"着","s":0,"i":"42bb8933","n":"Ongoing states, postures, or background. (If the verb is shì (be) or yǒu (have) it cannot be followed by zhe.)"},{"t":"Ongoing actions","e":"The notebook has written on it things that need to be bought.","p":"Bǐjìběn shàng xiě zhe xūyào mǎi de dōngxī.","h":"笔记本上写着需要买的东西。","s":1,"i":"349d6e53"},{"t":"Ongoing actions","e":"A man is standing outside the classroom.","p":"Jiàoshì wài zhàn zhe yī ge nán rén.","h":"教室外站着一个男人。","s":1,"i":"f6b6187a"},{"t":"Ongoing actions","e":"This building houses many teachers.","p":"Zhè ge lóu lǐ zhù zhe hěn duō lǎoshī.","h":"这个楼里住着很多老师。","s":1,"i":"316e5b74"},{"t":"Ongoing actions","e":"A table is placed next to the bed.","p":"Chuáng pángbiān fàng zhe yī zhāng zhuōzi.","h":"床旁边放着一张桌子。","s":1,"i":"b09abdb1"},{"t":"Ongoing actions","e":"There are many people sitting in the room.","p":"Fángjiān lǐ zuò zhe hěn duō rén.","h":"房间里坐着很多人。","s":1,"i":"9b5e8ace"},{"t":"Ongoing actions","e":"Hurry up, everyone is waiting for you.","p":"Nǐ kuài diǎn, dàjiā dōu děng zhe nǐ.","h":"你快点，大家都等着你。","s":1,"i":"3df2e189"},{"t":"Ongoing actions","e":"The air conditioning in the room is on.","p":"Fángjiān de kōngtiáo kāi zhe.","h":"房间的空调开着。","s":1,"i":"1ce48a06"},{"t":"Ongoing actions","e":"She is wearing a white skirt.","p":"Tā chuān zhe báisè de qúnzi.","h":"她穿着白色的裙子。","s":1,"i":"2c9078bd"},{"t":"Ongoing actions","e":"I am driving the car right now.","p":"Wǒ xiànzài kāi zhe chē.","h":"我现在开着车。","s":1,"i":"e0a3696c"},{"t":"Ongoing actions","e":"Don't talk on the phone while driving.","p":"Bùyào kāi zhe chē dǎ diànhuà.","h":"不要开着车打电话。","s":1,"i":"d024559e"},{"t":"Ongoing actions","e":"Lili is sitting and reading a book.","p":"Lìlì zuò zhe kàn shū.","h":"莉莉坐着看书。","s":1,"i":"fa7d17ca"},{"t":"Like/Want/Need","e":"Like","p":"Xǐhuān","h":"喜欢","s":0,"i":"8891abbc"},{"t":"Like/Want/Need","e":"Want/Would like to","p":"Xiǎng","h":"想","s":0,"i":"517898ec"},{"t":"Like/Want/Need","e":"Love","p":"Ài","h":"爱","s":0,"i":"2effdf8c"},{"t":"Like/Want/Need","e":"I love you.","p":"Wǒ ài nǐ.","h":"我爱你。","s":1,"i":"cbf59cf0"},{"t":"Like/Want/Need","e":"Want, need to, should/must, takes/requires, will/intend to /going to (depending on context)","p":"Yào","h":"要","s":0,"i":"382c0e4d"},{"t":"Like/Want/Need","e":"Don't want / Don't","p":"Bù yào","h":"不要","s":0,"i":"e77d9ca6"},{"t":"Like/Want/Need","e":"Need / Require","p":"Xūyào","h":"需要","s":0,"i":"9af2b918"},{"t":"Like/Want/Need","e":"Hope; wish","p":"Xīwàng","h":"希望","s":0,"i":"80d40650"},{"t":"Like/Want/Need","e":"I think there's no hope left.","p":"Wǒ juéde méi xīwàng le.","h":"我觉得没希望了。","s":1,"i":"314d1d31"},{"t":"Like/Want/Need","e":"I hope tomorrow is sunny/clear.","p":"Wǒ xīwàng míngtiān shì qíngtiān.","h":"我希望明天是晴天。","s":1,"i":"3031f161"},{"t":"Like/Want/Need","e":"What does he want to do?","p":"Tā xiǎng zuò shénme?","h":"他想做什么","s":1,"i":"a77d5be3"},{"t":"Like/Want/Need","e":"Please don't watch TV.","p":"Qǐng bùyào kàn diànshì.","h":"请不要看电视。","s":1,"i":"e28412ea"},{"t":"Like/Want/Need","e":"Please don't eat here.","p":"Qǐng bùyào zài zhèr chī fàn.","h":"请不要在这儿吃饭。","s":1,"i":"2b68cccf"},{"t":"Like/Want/Need","e":"You have a cold, you should drink more water.","p":"Nǐ gǎnmào le, yào duō hē shuǐ.","h":"你感冒了,要多喝水。","s":1,"i":"00de71c9"},{"t":"Like/Want/Need","e":"You should thank ow.","p":"Wǒ ràng fúwùyuán xiànzài jiù qù kàn yīxià.","h":"我让服务员现在就去看一下。","s":1,"i":"f20352b9"},{"t":"Hotel","e":"I booked a room.","p":"Wǒ dìng le yī ge fángjiān.","h":"我订了一个房间。","s":1,"i":"b3136460"},{"t":"Hotel","e":"I want to book a ticket to Beijing.","p":"Wǒ yào dìng yī zhāng qù Běijīng de piào.","h":"我要订一张去北京的票。","s":1,"i":"3cd4d40b"},{"t":"Hotel","e":"I booked a table at Shanghai Restaurant.","p":"Wǒ zài Shànghǎi fàndiàn dìng le yī zhāng zhuōzi.","h":"我在上海饭店订了一张桌子。","s":1,"i":"5d9dd1ae"},{"t":"Photo","e":"Photograph / photo","p":"Zhàopiàn","h":"照片","s":0,"i":"4b3018d7"},{"t":"Photo","e":"To take (a photo) / to photograph","p":"Pāi","h":"拍","s":0,"i":"a4dd3359"},{"t":"Photo","e":"Is the boy in the photo you?","p":"Zhàopiàn lǐ de nánhái shì nǐ ma?","h":"照片里的男孩是你吗？","s":1,"i":"bb523e48"},{"t":"Photo","e":"I found a photo in the room.","p":"Wǒ zài fángjiān lǐ zhǎodào le yī zhāng zhàopiàn.","h":"我在房间里找到了一张照片。","s":1,"i":"990a000b"},{"t":"Photo","e":"The manager needs a photo of you.","p":"Jīnglǐ xūyào yī zhāng nǐ de zhàopiàn.","h":"经理需要一张你的照片。","s":1,"i":"0a7633fc"},{"t":"Photo","e":"He took a lot of photos for me.","p":"Tā bāng wǒ pāi le hěn duō zhàopiàn.","h":"他帮我拍了很多照片。","s":1,"i":"61e4d2a8"},{"t":"Photo","e":"This photo was taken in Beijing.","p":"Zhè zhāng zhàopiàn shì zài Běijīng pāi de.","h":"这张照片是在北京拍的。","s":1,"i":"83c1902b"},{"t":"Photo","e":"Stand a bit to the left, look at me, smile a little — very good.","p":"Wǎng zuǒbiān zhàn yīdiǎn, yǎnjīng kàn wǒ, xiào yīxià, fēicháng hǎo.","h":"往左边站一点，眼睛看我，笑一下，非常好。","s":1,"i":"d6cd3e05"},{"t":"Photo","e":"Can you take a photo for us?","p":"Nǐ néng bāng wǒmen pāi yī zhāng zhàopiàn ma?","h":"你能帮我们拍一张照片吗？","s":1,"i":"732857c3"},{"t":"Photo","e":"This photo was taken last summer.","p":"Zhè zhāng zhàopiàn shì qùnián xiàtiān pāi de.","h":"这张照片是去年夏天拍的。","s":1,"i":"fbdf1de7"},{"t":"Photo","e":"Can you take one more?","p":"Néng zài pāi yī zhāng ma?","h":"能再拍一张吗？","s":1,"i":"357780be"},{"t":"Photo","e":"Look, this is a photo of her.","p":"Nǐ kàn, zhè shì tā de zhàopiàn.","h":"你看，这是她的照片。","s":1,"i":"95e2ede8"}];
const $=s=>document.querySelector(s),K='zhcards.progress.v1',S='zhcards.settings.v1';
let prog={},st={mode:'random',type:'both',dir:'ep',show:'all',theme:'',shuffle:'1'};
try{prog=JSON.parse(localStorage.getItem(K))||{}}catch(e){}
try{Object.assign(st,JSON.parse(localStorage.getItem(S))||{})}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(prog));localStorage.setItem(S,JSON.stringify(st))}catch(e){}};
const themes=[...new Set(D.map(c=>c.t))];
if(!themes.includes(st.theme))st.theme=themes[0];
const view=v=>['setup','study','end'].forEach(x=>$('#'+x).hidden=x!==v);
const typeOk=c=>st.type==='both'||(st.type==='s')===!!c.s;
function pool(){return D.filter(c=>{
 if(!typeOk(c))return false;
 if(st.mode==='random'?c.d:c.t!==st.theme)return false;
 const g=prog[c.i];
 if(st.show==='todo'&&g===1)return false;
 if(st.show==='learn'&&g!==2)return false;
 return true})}
function setup(){
 document.querySelectorAll('.seg').forEach(s=>s.querySelectorAll('button').forEach(b=>b.classList.toggle('on',String(st[s.dataset.k])===b.dataset.v)));
 const sel=$('#theme');sel.hidden=st.mode!=='theme';
 sel.innerHTML=themes.map(t=>`<option value="${t.replace(/"/g,'&quot;')}">${t} (${D.filter(c=>c.t===t&&typeOk(c)).length})</option>`).join('');
 sel.value=st.theme;
 const n=pool().length;$('#go').disabled=!n;
 $('#msg').textContent=n?`${n} card${n===1?'':'s'} ready`:'No cards match these choices.';
 const u=D.filter(c=>!c.d),g=u.filter(c=>prog[c.i]===1).length,l=u.filter(c=>prog[c.i]===2).length;
 $('#pbar').style.width=(100*g/u.length)+'%';
 $('#ptxt').textContent=`${g} got it · ${l} still learning · ${u.length-g-l} new (of ${u.length})`;
}
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{st[b.parentNode.dataset.k]=b.dataset.v;save();setup()});
$('#theme').onchange=e=>{st.theme=e.target.value;save();setup()};
$('#reset').onclick=()=>{if(confirm('Reset all progress on this device?')){prog={};save();setup()}};
let deck=[],ix=0,flip=false,rec={g:0,l:0};
function start(){deck=pool();if(!deck.length)return;
 if(st.shuffle==='1')for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}
 ix=0;flip=false;rec={g:0,l:0};view('study');draw()}
const esc=s=>s.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
function draw(){
 if(ix>=deck.length)return finish();
 if(document.activeElement)document.activeElement.blur();
 const c=deck[ix],ep=st.dir==='ep';
 const front=ep?c.e:c.p,back=ep?c.p:c.e,txt=flip?back:front;
 const note=(ep?!flip:flip)&&c.n?`<span class="note">${esc(c.n)}</span>`:'';
 $('#card').innerHTML=`<div class="lab">${flip?'':esc(c.t)}</div><div class="main${txt.length>40?' long':''}">${esc(txt)}${note}</div><div class="foot"><span>${c.s?'Sentence':'Word/Phrase'}</span><span>${flip?'':'Tap to flip'}</span></div>${ep===flip?'<button class="spk" aria-label="Play audio">🔊</button>':''}`;
 const sp=$('#card .spk');if(sp)sp.onclick=e=>{e.stopPropagation();say(c.h)};
 $('#count').textContent=`${ix+1} / ${deck.length}`;$('#msg2').textContent='';
}
$('#card').onclick=()=>{flip=!flip;draw()};
function mark(v){const c=deck[ix];prog[c.i]=v;v===1?rec.g++:rec.l++;save();ix++;flip=false;draw()}
$('#got').onclick=()=>mark(1);$('#learn').onclick=()=>mark(2);
$('#skip').onclick=()=>{ix++;flip=false;draw()};
$('#prev').onclick=()=>{ix=Math.max(0,ix-1);flip=false;draw()};
$('#back').onclick=()=>{view('setup');setup()};
function finish(){view('end');$('#sum').textContent=`${rec.g} marked got it · ${rec.l} marked still learning · ${deck.length} cards in this round`}
$('#again').onclick=start;$('#menu').onclick=()=>{view('setup');setup()};
$('#go').onclick=start;
let voices=[];
if('speechSynthesis' in window){const lv=()=>voices=speechSynthesis.getVoices();lv();speechSynthesis.onvoiceschanged=lv}
function say(t){
 if(!('speechSynthesis' in window)){$('#msg2').textContent='Audio is not supported in this browser.';return}
 const v=voices.find(v=>/^zh[-_]CN/i.test(v.lang))||voices.find(v=>/^zh/i.test(v.lang));
 if(!v)$('#msg2').textContent='No Chinese voice found. Install one in your phone’s text-to-speech settings.';
 speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);
 if(v)u.voice=v;u.lang=v?v.lang:'zh-CN';u.rate=.85;speechSynthesis.speak(u)}
document.addEventListener('keydown',e=>{
 if($('#study').hidden||e.metaKey||e.ctrlKey)return;
 const k=e.key;
 if(k===' '||k==='Enter'){e.preventDefault();flip=!flip;draw()}
 else if(k==='ArrowRight'){ix++;flip=false;draw()}
 else if(k==='ArrowLeft'){ix=Math.max(0,ix-1);flip=false;draw()}
 else if(k==='1')mark(2);else if(k==='2')mark(1)});
setup();
</script>
